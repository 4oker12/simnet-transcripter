name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile app.py smoke_test.py experiments/*.py
      - name: Shell syntax
        run: bash -n start.sh stop.sh restart.sh status.sh transcribe.sh setup-transcriber.sh diagnostic.sh simnet-transcriber-supervisor.sh profile.sh repo.sh
