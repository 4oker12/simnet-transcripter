[program:simnet-transcriber]
environment=PROC_NAME="%(program_name)s",SIMNET_MODEL_PATH="/workspace/simnet-transcriber/models/faster-whisper-large-v3",HF_HUB_DISABLE_XET="1",HF_HUB_OFFLINE="1",PYTHONPYCACHEPREFIX="/tmp/simnet-pycache"
command=/workspace/simnet-transcriber/simnet-transcriber-supervisor.sh
directory=/workspace/simnet-transcriber
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/simnet-transcriber.log
redirect_stderr=true
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
