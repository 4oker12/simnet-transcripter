[program:simnet-transcriber]
environment=PROC_NAME="%(program_name)s",SIMNET_TRANSCRIBER_DIR="/workspace/simnet-transcripter",SIMNET_PYTHON="/venv/main/bin/python",SIMNET_HOST="127.0.0.1",SIMNET_PORT="8000"
command=/opt/supervisor-scripts/simnet-transcriber.sh
directory=/workspace/simnet-transcripter
autostart=false
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
